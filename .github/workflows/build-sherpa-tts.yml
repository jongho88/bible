name: Build sherpa-onnx Korean TTS (wasm)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-sherpa-tts.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23
          actions-cache-folder: 'emsdk-cache'

      - name: Clone sherpa-onnx
        run: git clone --depth 1 https://github.com/k2-fsa/sherpa-onnx.git /tmp/sherpa

      - name: Download Supertonic 3 int8 model (31 languages incl. Korean)
        run: |
          cd /tmp/sherpa/wasm/tts/assets
          m=sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          curl -SL -O https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$m.tar.bz2
          tar xf $m.tar.bz2 && rm $m.tar.bz2
          mv $m/duration_predictor.int8.onnx $m/text_encoder.int8.onnx $m/vector_estimator.int8.onnx \
             $m/vocoder.int8.onnx $m/tts.json $m/unicode_indexer.bin $m/voice.bin .
          rm -rf $m
          ls -lh
          sed -i 's/let modelType = 0/let modelType = 7/' ../sherpa-onnx-tts.js

      - name: Build
        run: |
          cd /tmp/sherpa
          emcc -v
          ./build-wasm-simd-tts.sh
          ls -lh build-wasm-simd-tts/install/bin/wasm/tts

      - name: Copy to tts-sherpa/
        run: |
          rm -rf tts-sherpa && mkdir tts-sherpa
          cp -r /tmp/sherpa/build-wasm-simd-tts/install/bin/wasm/tts/* tts-sherpa/
          # default language: Korean
          printf '\n;(function(){var t=setInterval(function(){var s=document.getElementById("lang");if(s&&[...s.options].some(function(o){return o.value==="ko"})){s.value="ko";s.dispatchEvent(new Event("change"));clearInterval(t)}},500)})();\n' >> tts-sherpa/app-tts.js
          grep -o "getPreloadedPackage[^;]\{0,80\}" tts-sherpa/sherpa-onnx-wasm-main-tts.js | head -3
          # GitHub allows max 100MB per file: split the model data in 2 parts
          cd tts-sherpa
          split -b 70M -d -a 1 sherpa-onnx-wasm-main-tts.data sherpa-onnx-wasm-main-tts.data.part
          rm sherpa-onnx-wasm-main-tts.data
          python3 - <<'EOP'
          p='sherpa-onnx-tts.worker.js'
          s=open(p).read()
          old='importScripts("sherpa-onnx-wasm-main-tts.js");\nimportScripts("sherpa-onnx-tts.js");'
          assert old in s
          new = """
          async function sbLoadParts(){
            const names=['sherpa-onnx-wasm-main-tts.data.part0','sherpa-onnx-wasm-main-tts.data.part1'];
            let cache=null; try{cache=await caches.open('stepbible-sherpa-v1');}catch(e){}
            const bufs=[];
            for(let i=0;i<names.length;i++){
              self.postMessage({type:'sherpa-onnx-tts-progress',status:'모델 받는 중 ('+(i+1)+'/'+names.length+') …'});
              let r=cache?await cache.match(names[i]):null;
              if(!r){ r=await fetch(names[i]); if(!r.ok) throw new Error('download failed '+names[i]); if(cache){ try{await cache.put(names[i], r.clone());}catch(e){} } }
              bufs.push(new Uint8Array(await r.arrayBuffer()));
            }
            let n=0; for(const b of bufs) n+=b.length;
            const all=new Uint8Array(n); let o=0; for(const b of bufs){all.set(b,o);o+=b.length;}
            return all.buffer;
          }
          sbLoadParts().then(function(buf){
            self.Module.getPreloadedPackage=function(){ return buf; };
            importScripts("sherpa-onnx-wasm-main-tts.js");
            importScripts("sherpa-onnx-tts.js");
          }).catch(function(e){ self.postMessage({type:'error',message:'모델 다운로드 실패: '+e.message}); });
          """
          s=s.replace(old,new)
          open(p,'w').write(s)
          EOP
          cd ..
          ls -lh tts-sherpa
          big=$(find tts-sherpa -size +99M)
          if [ -n "$big" ]; then echo "File over 99MB (GitHub limit): $big"; exit 1; fi

      - name: Commit
        run: |
          git config user.name "jongho88"
          git config user.email "352164435+jongho88@users.noreply.github.com"
          git add tts-sherpa
          git commit -m "sherpa-onnx 한국어 읽어주기 시험 빌드 (Supertonic 3 int8)" || exit 0
          git push
