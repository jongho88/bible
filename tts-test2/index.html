<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StepBible 읽어주기 시험 2</title>
<style>
:root{--ink:#1b1a17;--sub:#6b665c;--line:#e8e1d3;--brown:#92400e;--bg:#fffdf8}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
.w{max-width:640px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:23px;margin:0 0 4px}h1 b{color:var(--brown)}
p.s{color:var(--sub);font-size:14px;margin:0 0 16px;line-height:1.6}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fff}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 6px}
textarea,input[type=range]{width:100%;box-sizing:border-box;font:inherit}
textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-size:16px;min-height:150px;line-height:1.7}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;min-height:46px;width:100%;margin-top:10px;background:var(--brown);color:#fff;font-size:16px}
button.g{background:#eee6d8;color:var(--ink)}button:disabled{opacity:.45}
.st{font-size:14px;line-height:1.6;color:var(--sub);white-space:pre-line;margin-top:8px}
.bar{height:8px;border-radius:4px;background:#eee6d8;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--brown);transition:width .2s}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{width:auto;flex:none;min-height:36px;padding:6px 12px;font-size:14px;margin:0;background:#eee6d8;color:var(--ink);font-weight:600}
audio{width:100%;margin-top:12px}
#err{display:none;color:#b3362f;font-size:13px;white-space:pre-wrap}
</style></head><body><div class="w">
<h1><b>Step</b>Bible 읽어주기 시험 2</h1>
<p class="s">가벼운 한국어 음성 모델(약 38MB)이 이 휴대폰 안에서 개역한글을 읽어 줘요. 처음 한 번만 내려받고, 다음부터는 저장된 걸 써요.</p>
<div class="box"><button id="load">1. 음성 모델 받기 (약 38MB)</button><div class="bar"><i id="pb"></i></div><div class="st" id="st">아직 받지 않았어요.</div></div>
<div class="box">
<label>읽는 속도 <span id="spv">1.00</span>배</label><input type="range" id="speed" min="0.7" max="1.5" step="0.05" value="1.0">
<label>읽을 본문</label><div class="chips"><button data-t="gen">창세기 1:1–5</button><button data-t="ps">시편 23편</button></div>
<textarea id="text" style="margin-top:8px">태초에 하나님이 천지를 창조하시니라
땅이 혼돈하고 공허하며 흑암이 깊음 위에 있고 하나님의 신은 수면에 운행하시니라
하나님이 가라사대 빛이 있으라 하시매 빛이 있었고
그 빛이 하나님의 보시기에 좋았더라 하나님이 빛과 어두움을 나누사
빛을 낮이라 칭하시고 어두움을 밤이라 칭하시니라 저녁이 되며 아침이 되니 이는 첫째 날이니라</textarea>
<button id="go" disabled>2. 읽기</button><div class="st" id="res"></div>
<button id="play" class="g" disabled>▶ 들어 보기</button><audio id="au" controls playsinline></audio></div>
<div class="box" id="err"></div>
<p class="s">음성 모델: Meta MMS-TTS 한국어 (CC BY-NC 4.0, 비영리 사용). 본문: 성경전서 개역한글판.</p>
</div>
<script type="module">
const $=s=>document.querySelector(s);
const err=m=>{const b=$('#err');b.style.display='block';b.textContent+=m+'\n'};
addEventListener('error',e=>err('오류: '+e.message));addEventListener('unhandledrejection',e=>err('오류: '+((e.reason&&e.reason.message)||e.reason)));
const T={gen:`태초에 하나님이 천지를 창조하시니라
땅이 혼돈하고 공허하며 흑암이 깊음 위에 있고 하나님의 신은 수면에 운행하시니라
하나님이 가라사대 빛이 있으라 하시매 빛이 있었고
그 빛이 하나님의 보시기에 좋았더라 하나님이 빛과 어두움을 나누사
빛을 낮이라 칭하시고 어두움을 밤이라 칭하시니라 저녁이 되며 아침이 되니 이는 첫째 날이니라`,ps:`여호와는 나의 목자시니 내가 부족함이 없으리로다
그가 나를 푸른 초장에 누이시며 쉴만한 물 가으로 인도하시는도다
내 영혼을 소생시키시고 자기 이름을 위하여 의의 길로 인도하시는도다
내가 사망의 음침한 골짜기로 다닐찌라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다
주께서 내 원수의 목전에서 내게 상을 베푸시고 기름으로 내 머리에 바르셨으니 내 잔이 넘치나이다
나의 평생에 선하심과 인자하심이 정녕 나를 따르리니 내가 여호와의 집에 영원히 거하리로다`};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>$('#text').value=T[b.dataset.t]);
$('#speed').oninput=e=>{$('#spv').textContent=(+e.target.value).toFixed(2);$('#au').playbackRate=+e.target.value};
// 한글 → 로마자 (모델이 로마자로 학습됨)
const L=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
const V=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
const F=['','k','k','k','n','n','n','t','l','k','m','p','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
const FL=['','g','kk','gs','n','nj','nh','d','r','lg','lm','lb','ls','lt','lp','lh','m','b','bs','s','ss','ng','j','ch','k','t','p','h'];
function roman(s){let o='';const cs=[...s];for(let i=0;i<cs.length;i++){const c=cs[i].codePointAt(0);
  if(c>=0xAC00&&c<=0xD7A3){const k=c-0xAC00,l=Math.floor(k/588),v=Math.floor(k%588/28),t=k%28;
    o+=(o.endsWith('ng')&&L[l]===''?'':'')+L[l]+V[v];
    const nx=cs[i+1]?cs[i+1].codePointAt(0):0;const nxV=nx>=0xAC00&&nx<=0xD7A3&&Math.floor((nx-0xAC00)/588)===11;
    if(t){o+= nxV&&t!==21 ? FL[t] : F[t]}}
  else if(/[A-Za-z]/.test(cs[i]))o+=cs[i].toLowerCase();
  else if(/[\s]/.test(cs[i]))o+=' ';
  else if(/[,.!?;:]/.test(cs[i]))o+=' ';}
  return o.replace(/\s+/g,' ').trim()}
let tts=null;
$('#load').onclick=async()=>{const b=$('#load');b.disabled=true;$('#st').textContent='엔진 불러오는 중…';
  try{const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.1');
    env.allowLocalModels=false;const prog={};
    tts=await pipeline('text-to-speech','Xenova/mms-tts-kor',{dtype:'q8',device:'wasm',progress_callback:p=>{
      if(p.status==='progress'&&p.total){prog[p.file]=[p.loaded,p.total];let a=0,t=0;for(const k in prog){a+=prog[k][0];t+=prog[k][1]}
        $('#pb').style.width=(a/t*100).toFixed(1)+'%';$('#st').textContent=`내려받는 중… ${(a/1048576).toFixed(1)} / ${(t/1048576).toFixed(1)} MB`}
      else if(p.status==='ready')$('#st').textContent='준비 중…'}});
    $('#pb').style.width='100%';$('#st').textContent='준비 완료!';$('#go').disabled=false;b.textContent='모델 준비됨';
  }catch(e){console.error(e);err('모델 받기 실패: '+(e.message||e));$('#st').textContent='실패했어요. 빨간 칸을 확인해 주세요.';b.disabled=false}};
$('#play').onclick=()=>{const au=$('#au');au.playbackRate=+$('#speed').value;au.currentTime=0;au.play().catch(e=>err('재생 실패: '+e.message))};
function wavOf(f32,sr){const n=f32.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,f32[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true)}return new Blob([buf],{type:'audio/wav'})}
$('#go').onclick=async()=>{const b=$('#go');b.disabled=true;$('#play').disabled=true;
  try{const parts=$('#text').value.split(/\n+|(?<=[.?!])\s+/).map(x=>x.trim()).filter(Boolean);const t0=performance.now();const out=[];let sr=16000;
    for(let i=0;i<parts.length;i++){$('#res').textContent=`만드는 중… ${i+1}/${parts.length}`;const r=roman(parts[i]);if(!r)continue;
      const o=await tts(r);sr=o.sampling_rate;out.push(o.audio,new Float32Array(Math.floor(sr*.35)))}
    let n=0;out.forEach(a=>n+=a.length);const all=new Float32Array(n);let p=0;out.forEach(a=>{all.set(a,p);p+=a.length});
    let pk=0;for(let i=0;i<all.length;i++)pk=Math.max(pk,Math.abs(all[i]));
    const au=$('#au');au.src=URL.createObjectURL(wavOf(all,sr));au.load();$('#play').disabled=false;
    $('#res').textContent=`만드는 데 ${((performance.now()-t0)/1000).toFixed(1)}초 · 음성 길이 ${(n/sr).toFixed(1)}초 · 소리 크기 ${pk.toFixed(2)}\n이제 ▶ 들어 보기를 눌러 주세요.`;
  }catch(e){console.error(e);err('읽기 실패: '+(e.message||e))}b.disabled=false};
window.__roman=roman;
</script></body></html>
